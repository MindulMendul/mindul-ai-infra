version: '3.8'

services:
  # 1. 공통 AI 추론 엔진 (Ollama)
  ollama:
    image: ollama/ollama:latest
    container_name: mindul-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - mindul-net

  # 2. 공통 메시지 큐 (Kafka)
  kafka:
    image: apache/kafka:latest
    container_name: mindul-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://mindul-kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@mindul-kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://mindul-kafka:29092,CONTROLLER://mindul-kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      KAFKA_CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
    networks:
      - mindul-net

  # 3. 공통 Kafka 모니터링 UI
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mindul-kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: mindul-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: mindul-kafka:29092
    depends_on:
      - kafka
    networks:
      - mindul-net

     # 4. 브라우저용 Web VS Code (code-server)
  code-server:
    image: lscr.io/linuxserver/code-server:latest
    container_name: mindul-vscode
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Seoul
      - PASSWORD=4351  # 👈 브라우저 접속할 때 쓸 비밀번호!
    volumes:
      - /home/ubuntu:/config/workspace  # 👈 오라클 서버의 홈 디렉토리를 VS Code 워크스페이스로 연결
      - /var/run/docker.sock:/var/run/docker.sock  # (선택) VS Code 터미널에서 docker 명령어 사용
    networks:
      - mindul-net

  # 5. 인프라 관리 UI (Portainer)
  portainer:
    image: portainer/portainer-ce:latest
    container_name: mindul-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - mindul-net

volumes:
  ollama_data:
  portainer_data:

networks:
  mindul-net:
    name: mindul-net
    driver: bridge
