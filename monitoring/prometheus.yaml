global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: containers
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: telemetry
    scrape_interval: 15s
    static_configs: [{targets: ["telemetry-gateway:8080"]}]
  - job_name: web
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/web-metrics.token
    static_configs:
      - targets: ["mindul-murder-mystery:3000"]
        labels: {environment: production}
      - targets: ["mindul-murder-mystery-qa:3000"]
        labels: {environment: qa}
  - job_name: prometheus
    static_configs: [{targets: ["localhost:9090"]}]
