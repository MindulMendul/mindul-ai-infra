name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        env:
          CODE_SERVER_PASSWORD: dummy
        run: docker compose config

      - name: Shellcheck scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: './scripts'

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # SSH_PRIVATE_KEY holds the key base64-encoded (single line) so it
      # survives being pasted into the GitHub secret UI without the
      # multiline PEM getting mangled. Decode it to a runner-temp file and
      # hand ssh-action a path instead of the raw key.
      - name: Decode deploy key
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          echo "${SSH_PRIVATE_KEY_B64}" | base64 -d > "${{ runner.temp }}/deploy_key.pem"
          chmod 600 "${{ runner.temp }}/deploy_key.pem"

      - name: Deploy to server over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          CODE_SERVER_PASSWORD: ${{ secrets.CODE_SERVER_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key_path: /github/runner_temp/deploy_key.pem
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: DEPLOY_PATH,CODE_SERVER_PASSWORD
          script: |
            set -e
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            cat > .env <<ENVEOF
            CODE_SERVER_PASSWORD=$CODE_SERVER_PASSWORD
            ENVEOF
            chmod 600 .env
            docker compose pull
            docker compose up -d
